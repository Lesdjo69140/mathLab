<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiktok view or SnapScore</title>
  <style>
    :root {
      --accent: #4c3be6;
      --neon-pink: #ff2d75;
      --neon-blue: #00f2ea;
      --bg-dark: #0b0b0f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(-45deg, #0b0b0f, #141428, #1a1a3a, #0b0b0f);
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e4e4e7;
      overflow: hidden;
      cursor: none; /* cacher le curseur natif */
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 40px;
      z-index: 1;
    }

    .header span {
      font-size: 2rem;
      color: var(--accent);
      text-shadow: 0 0 15px var(--accent);
      letter-spacing: 1px;
    }

    .header img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .grid {
      display: flex;
      gap: 40px;
      z-index: 1;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: rgba(0, 0, 0, 0.9);
      border-radius: 20px;
      padding: 40px;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    .card img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px var(--accent), 0 0 45px rgba(255, 255, 255, 0.5);
    }

    .card:hover img {
      transform: scale(1.1);
      filter: drop-shadow(0 0 20px var(--accent));
    }

    .card h2 {
      margin-top: 20px;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent);
      font-size: 1.3rem;
    }

    .author {
      position: absolute;
      bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #a1a1aa;
      z-index: 1;
    }

    .author img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .discord-logo {
      position: absolute;
      bottom: 80px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .discord-logo img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .discord-logo img:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px var(--accent), 0 0 45px rgba(76,59,230,0.5);
    }

    /* Curseur personnalisé */
    .cursor-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 80px;
      height: 80px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }
    .cursor-overlay img {
      width: 100%;
      height: 100%;
      user-select: none;
    }
  </style>
</head>
<body>

  <!-- Titre en haut avec le pseudo + certif -->
  <div class="header">
     <span style="
    color: #ffffff;
    text-shadow: 0 0 5px #ffffff,
                 0 0 10px #ffffff,
                 0 0 20px #ffffff,
                 0 0 40px #ffffff;
  ">𝐇𝐃𝕀.𝟔𝟗𝕂</span>
    <img src="Certif.PNG" alt="Certif">
  </div>

  <div class="grid">
    <!-- TikTok -->
    <div class="card" onclick="location.href='view.html'">
      <img src="logo tiktok.png" alt="TikTok">
      <h2 style="
    color: #ffffff;
    text-shadow: 0 0 5px #ffffff,
                 0 0 10px #ffffff,
                 0 0 20px #ffffff,
                 0 0 40px #ffffff;">Vues TikTok</h2>
    </div>

    <!-- Snapchat -->
    <div class="card" onclick="location.href='snap.html'">
      <img src="snapscore logo.png" alt="Snapchat">
      <h2 style="
    color: #11678a;
    text-shadow: 0 0 5px  #11678a,
                 0 0 10px #11678a,
                 0 0 20px #11678a,
                 0 0 40px #11678a;">Snap Score</h2>
    </div>
</div>

  <!-- Logo Discord -->
  <div class="discord-logo">
    <a href="https://discord.gg/FnUXHThb" target="_blank">
      <img src="logo discord.png" alt="Discord">
    </a>
  </div>

  <div class="author">
    <span style="
      color: #ffffff;
      text-shadow: 0 0 5px #ffffff,
                   0 0 10px #ffffff,
                   0 0 20px #ffffff,
                   0 0 40px #ffffff;
    ">
      By 𝐇𝐃𝕀.𝟔𝟗𝕂
    </span>
    <img src="Certif.PNG" alt="Certif">
  </div>

  <!-- Curseur -->
  <div class="cursor-overlay">
    <img src="cursor.webp" alt="Curseur personnalisé">
  </div>

  <script>
    const cursor = document.querySelector('.cursor-overlay');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = `${e.clientX}px`;
      cursor.style.top = `${e.clientY}px`;
    });
  </script>
</body>
</html>
