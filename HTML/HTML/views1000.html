<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pack +1000 vues 🎯 - 𝐇𝐃𝕀.𝟔𝟗𝕂</title>
  <style>
    :root { --accent: #3714d1; --bg-dark: #0c0c0f; --text-light: #e4e4e7; }
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #0a0a0f, #1a1a25 60%, #0a0a0f);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      position: relative;
      cursor: none; /* On cache le curseur natif */
    }
    h1 {
      font-size: 2rem;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent);
      margin-bottom: 15px;
    }
    p { font-size: 1rem; color: #a1a1aa; max-width: 500px; }
    button {
      margin-top: 30px;
      background: var(--accent);
      color: black;
      border: none;
      border-radius: 12px;
      padding: 14px 30px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 12px var(--accent);
    }
    button:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--accent); }
    .back {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 0.9rem;
      color: #9ca3af;
      text-decoration: none;
      transition: 0.3s;
    }
    .back:hover { color: var(--accent); }
    .author {
      position: absolute;
      bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #a1a1aa;
      opacity: 0.9;
    }
    .author img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .confirmation-img {
      margin-top: 20px;
      max-width: 300px;
      border-radius: 12px;
      box-shadow: 0 0 15px var(--accent);
      display: none;
    }

    /* Curseur personnalisé */
    .cursor-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform 0.05s ease-out;
      z-index: 9999;
    }
    .cursor-overlay img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <a href="view.html" class="back">← Retour aux packs</a>
  <h1>Pack +1000 vues 🎯</h1>
  <p>Ce pack te permet d’obtenir <strong>+1000 vues</strong> rapidement.<br>Idéal pour un énorme boost sur ton compte.</p>
  <button onclick="confirmBoost()">Activer le pack</button>

  <small style="
    font-size: 1.1em;
    position: relative;
    top: -80px;
    color: #ffffff;
    text-shadow: 0 0 5px #ffffff,
                 0 0 10px #ffffff,
                 0 0 20px #ffffff,
                 0 0 40px #ffffff;
  ">
    Rejoins notre serveur Discord pour recevoir ta commande !
  </small>

  <img src="Snapscore HDI.69k.webp" alt="Snapscore HDI.69K" class="confirmation-img" id="confirmationImg">

  <div class="author">
    <span style="
      color: #ffffff;
      text-shadow: 0 0 5px #ffffff,
                   0 0 10px #ffffff,
                   0 0 20px #ffffff,
                   0 0 40px #ffffff;
    ">
      By 𝐇𝐃𝕀.𝟔𝟗𝕂
    </span>
    <img src="Certif.PNG" alt="Certif">
  </div>

  <!-- Curseur personnalisé -->
  <div class="cursor-overlay">
    <img src="cursor.webp" alt="Curseur personnalisé">
  </div>

  <script>
    function confirmBoost() {
      alert('Rejoins notre serveur Discord pour recevoir ta commande !');
      document.getElementById('confirmationImg').style.display = 'block';
      window.location.href = "https://discord.gg/FnUXHThb";
    }

    // Déplacement du curseur personnalisé
    const cursor = document.querySelector('.cursor-overlay');
    document.addEventListener('mousemove', e => {
      cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    });
  </script>
</body>
</html>
