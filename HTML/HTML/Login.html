<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Page de connexion - 69140</title>
  <style>
    :root {
      --card: #1a1a1a;
      --accent: #4c3be6;
      --muted: #cfd8dc;
    }

    * { box-sizing: border-box; font-family: 'Roboto', sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-image: url('wallpapersden.com_sung-jin-woo-solo-leveling_3840x2160.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      cursor: none; /* cacher le curseur natif */
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card);
      width: 360px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.5);
      padding: 28px;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 0.3s;
    }

    h1 { margin:0 0 8px; font-size: 22px; color: var(--accent); }
    p.lead { margin:0 0 18px; color: var(--muted); font-size:13px; }
    label { display:block; font-size:13px; margin-bottom:6px; }
    input[type=text], input[type=password] {
      width:100%; padding:10px 12px; border:1px solid #333; border-radius:8px; font-size:14px;
      background:#2a2a2a; color:#fff; transition:border 0.3s, box-shadow 0.3s;
    }
    input:focus { border-color:var(--accent); box-shadow:0 0 5px var(--accent); outline:none; }
    .input-with-icon { display:flex; align-items:center; gap:8px; }
    .icon-small { width:24px; height:24px; object-fit:contain; }
    .row { margin-bottom:14px; }
    .actions { display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
    button { background: var(--accent); color:white; border:0; padding:10px 14px; border-radius:10px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    .small { font-size:12px; color:var(--muted); }
    .toggle { background:transparent; border:0; color:var(--accent); cursor:pointer; font-weight:600; }
    .footer { margin-top:16px; font-size:12px; color:var(--muted); text-align:center; }
    a { color:var(--accent); font-weight:600; text-decoration:none; cursor:pointer; }
    a:hover { text-decoration:underline; }
    .error { color:#b91c1c; font-size:13px; margin-top:6px; }
    .success { color:#065f46; font-size:14px; margin-top:6px; }
    .author { display:flex; align-items:center; gap:8px; justify-content:center; margin-top:12px; }
    .author img { width:30px; height:30px; border-radius:50%; }

    /* Curseur personnalisé */
    .cursor-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 80px;
      height: 80px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }
    .cursor-overlay img {
      width: 100%;
      height: 100%;
      user-select: none;
    }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <h1>Se connecter</h1>
    <p class="lead">Entrez votre nom d'utilisateur et mot de passe</p>

    <form id="loginForm" autocomplete="off">
      <div class="row">
        <label for="username">Nom d'utilisateur</label>
        <div class="input-with-icon">
          <img src="icone utilisateur.png" alt="Icône utilisateur" class="icon-small" />
          <input id="username" name="username" type="text" placeholder="ex : lesdjo" required />
        </div>
      </div>

      <div class="row">
        <label for="password">Mot de passe</label>
        <div class="input-with-icon">
          <img src="cadenas cione.webp" alt="Icône cadenas" class="icon-small" />
          <input id="password" name="password" type="password" placeholder="Votre mot de passe" required />
          <button type="button" class="toggle" id="togglePw" aria-pressed="false">Afficher</button>
        </div>
      </div>

      <div class="row actions">
        <div class="small">Pas encore de compte ? <a id="signupLink">S'inscrire</a></div>
        <button id="submitBtn" type="submit">Connexion</button>
      </div>

      <div id="msg" role="status" aria-live="polite"></div>
    </form>

    <div class="footer">
      Free Palestine • Free Congo
      <div class="author">
        <span>By 𝐇𝐃𝕀.𝟔𝟗𝕂</span>
        <img src="Certif.PNG" alt="Certif">
      </div>
    </div>
  </main>

  <!-- Curseur -->
  <div class="cursor-overlay">
    <img src="cursor.webp" alt="Curseur personnalisé">
  </div>

  <script>
    const demoUsers = {
      'hdi.69k': { pw: '69140', redirect: 'https://guns.lol/69140' },
      'Adil69k': { pw: '69140', redirect: 'admin.html' },
      'admin': { pw: 'admin123', redirect: 'admin.html' },
      'Hedey': { pw: '69140', redirect: 'admin.html' },
      'Hedi69k': { pw: '69140', redirect: 'admin.html' },
      'SnapScoreBoss': { pw: '69140', redirect: 'admin.html' }
    };

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');
    const toggle = document.getElementById('togglePw');
    const passwordInput = document.getElementById('password');
    const signupLink = document.getElementById('signupLink');

    signupLink.addEventListener('click', () => {
      window.location.href = 'Sign Up.html';
    });

    toggle.addEventListener('click', () => {
      const shown = passwordInput.type === 'text';
      passwordInput.type = shown ? 'password' : 'text';
      toggle.textContent = shown ? 'Afficher' : 'Masquer';
      toggle.setAttribute('aria-pressed', String(!shown));
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = '';

      const username = document.getElementById('username').value.trim();
      const password = passwordInput.value;

      if (!username) {
        msg.textContent = "Veuillez entrer un nom d'utilisateur.";
        msg.className = 'error';
        return;
      }
      if (!password) {
        msg.textContent = 'Veuillez entrer le mot de passe.';
        msg.className = 'error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Vérification...';

      setTimeout(() => {
        const user = demoUsers[username];

        if(user && username === 'admin' && password === 'admin123') {
          msg.textContent = "Connexion réussie !";
          msg.className = 'success';
          window.location.replace('admin.html');
        }
        else if(user && user.pw === password) {
          msg.textContent = "Connexion réussie !";
          msg.className = 'success';
          window.location.replace(user.redirect);
        } else {
          window.location.replace('connected.html');
        }
      }, 700);
    });

    // Curseur personnalisé
    const cursor = document.querySelector('.cursor-overlay');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = `${e.clientX}px`;
      cursor.style.top = `${e.clientY}px`;
    });
  </script>
</body>
</html>
