<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>StatLab Pro | Analyse Statistique Avancée</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #10b981;
            --accent: #8b5cf6;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --input-bg: rgba(15, 23, 42, 0.7);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #475569;
            --gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #10b981 100%);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo i {
            font-size: 2.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .card:hover {
            border-color: var(--primary);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 25px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Input Section */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--text-primary);
        }

        .input-label span {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 400;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            z-index: 1;
        }

        .number-input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'JetBrains Mono', monospace;
            transition: var(--transition);
        }

        .number-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .range-slider {
            width: 100%;
            margin-top: 10px;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: var(--border-color);
            outline: none;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            border: 3px solid var(--card-bg);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        /* Buttons */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 16px 24px;
            border-radius: 12px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        /* Stats Display */
        .stats-display {
            grid-column: 1 / -1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.5);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            background: rgba(15, 23, 42, 0.7);
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Series Table */
        .series-table-container {
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .series-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        .series-table th {
            background: rgba(15, 23, 42, 0.7);
            padding: 15px;
            text-align: center;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
        }

        .series-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            transition: var(--transition);
        }

        .series-table tr:hover td {
            background: rgba(59, 130, 246, 0.1);
        }

        .data-cell {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .index-cell {
            color: var(--text-secondary);
            font-size: 0.9rem;
            background: rgba(15, 23, 42, 0.3);
        }

        /* Chart Container */
        .chart-container {
            height: 300px;
            margin-top: 30px;
            position: relative;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 20px;
        }

        .chart {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            padding: 10px;
        }

        .bar {
            flex: 1;
            background: var(--gradient);
            border-radius: 4px 4px 0 0;
            position: relative;
            transition: var(--transition);
            min-height: 2px;
        }

        .bar:hover {
            opacity: 0.8;
            transform: scaleY(1.05);
        }

        .bar-value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Export Section */
        .export-section {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .export-btn {
            padding: 12px 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .export-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .buttons-grid {
                grid-template-columns: 1fr;
            }
            
            .export-section {
                flex-direction: column;
            }
            
            .logo {
                font-size: 2.2rem;
            }
            
            .stat-value {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                StatLab Pro
            </div>
            <p class="subtitle">
                Générateur et analyseur de séries statistiques avec visualisations avancées
            </p>
        </header>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Input Card -->
            <div class="card">
                <h2 class="card-title">
                    <i class="fas fa-sliders-h"></i>
                    Paramètres de la série
                </h2>
                
                <div class="input-section">
                    <div class="input-group">
                        <label class="input-label">
                            Effectif total
                            <span id="effectifValue">5 éléments</span>
                        </label>
                        <div class="input-wrapper">
                            <i class="fas fa-hashtag"></i>
                            <input type="number" id="effectif" class="number-input" value="5" min="3" max="50" step="1">
                        </div>
                        <input type="range" id="effectifRange" class="range-slider" min="3" max="50" value="5">
                    </div>

                    <div class="input-group">
                        <label class="input-label">
                            Moyenne (μ)
                            <span id="moyenneValue">10.0</span>
                        </label>
                        <div class="input-wrapper">
                            <i class="fas fa-calculator"></i>
                            <input type="number" id="moyenne" class="number-input" value="10.0" step="0.1">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">
                            Médiane (Q₂)
                            <span id="medianeValue">10.0</span>
                        </label>
                        <div class="input-wrapper">
                            <i class="fas fa-sort-amount-down"></i>
                            <input type="number" id="mediane" class="number-input" value="10.0" step="0.1">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">
                            Étendue (R)
                            <span id="etendueValue">4.0</span>
                        </label>
                        <div class="input-wrapper">
                            <i class="fas fa-ruler"></i>
                            <input type="number" id="etendue" class="number-input" value="4.0" min="0" step="0.1">
                        </div>
                        <input type="range" id="etendueRange" class="range-slider" min="0.1" max="20" value="4" step="0.1">
                    </div>
                </div>

                <div class="buttons-grid">
                    <button class="btn btn-primary" id="generateBtn">
                        <i class="fas fa-bolt"></i>
                        Générer la série
                    </button>
                    <button class="btn btn-secondary" id="randomBtn">
                        <i class="fas fa-random"></i>
                        Aléatoire
                    </button>
                    <button class="btn btn-secondary" id="exampleBtn">
                        <i class="fas fa-list-ol"></i>
                        Exemple
                    </button>
                    <button class="btn btn-danger" id="resetBtn">
                        <i class="fas fa-redo"></i>
                        Réinitialiser
                    </button>
                </div>
            </div>

            <!-- Statistics Card -->
            <div class="card">
                <h2 class="card-title">
                    <i class="fas fa-chart-bar"></i>
                    Statistiques
                </h2>
                
                <div class="stats-grid" id="statsGrid">
                    <!-- Stats will be populated by JavaScript -->
                </div>

                <div class="chart-container">
                    <div class="chart" id="chart">
                        <!-- Chart bars will be generated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Results Card -->
            <div class="card stats-display">
                <h2 class="card-title">
                    <i class="fas fa-table"></i>
                    Série générée
                </h2>
                
                <div class="series-table-container">
                    <table class="series-table" id="seriesTable">
                        <!-- Table will be populated by JavaScript -->
                    </table>
                </div>

                <div class="export-section">
                    <button class="export-btn" id="exportCSV">
                        <i class="fas fa-file-csv"></i>
                        Exporter CSV
                    </button>
                    <button class="export-btn" id="exportJSON">
                        <i class="fas fa-file-code"></i>
                        Exporter JSON
                    </button>
                    <button class="export-btn" id="copyBtn">
                        <i class="fas fa-copy"></i>
                        Copier les données
                    </button>
                    <button class="export-btn" id="saveBtn">
                        <i class="fas fa-save"></i>
                        Sauvegarder
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2024 StatLab Pro • Outil d'analyse statistique avancé</p>
            <p>Les séries sont générées selon les paramètres spécifiés</p>
        </footer>

        <!-- Modal -->
        <div class="modal" id="modal">
            <div class="modal-content">
                <h3 class="modal-title" id="modalTitle"></h3>
                <pre id="modalContent"></pre>
                <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                    <button class="btn btn-secondary" id="closeModal">Fermer</button>
                    <button class="btn btn-primary" id="copyModal">Copier</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class StatisticsGenerator {
            constructor() {
                this.serie = [];
                this.init();
            }
            
            init() {
                this.bindEvents();
                this.updateSliders();
                this.generateSeries(); // Initial generation
            }
            
            bindEvents() {
                // Input events
                document.getElementById('effectif').addEventListener('input', (e) => {
                    document.getElementById('effectifValue').textContent = `${e.target.value} éléments`;
                    document.getElementById('effectifRange').value = e.target.value;
                });
                
                document.getElementById('effectifRange').addEventListener('input', (e) => {
                    document.getElementById('effectif').value = e.target.value;
                    document.getElementById('effectifValue').textContent = `${e.target.value} éléments`;
                });
                
                document.getElementById('moyenne').addEventListener('input', (e) => {
                    document.getElementById('moyenneValue').textContent = parseFloat(e.target.value).toFixed(2);
                });
                
                document.getElementById('mediane').addEventListener('input', (e) => {
                    document.getElementById('medianeValue').textContent = parseFloat(e.target.value).toFixed(2);
                });
                
                document.getElementById('etendue').addEventListener('input', (e) => {
                    document.getElementById('etendueValue').textContent = parseFloat(e.target.value).toFixed(2);
                    document.getElementById('etendueRange').value = e.target.value;
                });
                
                document.getElementById('etendueRange').addEventListener('input', (e) => {
                    document.getElementById('etendue').value = e.target.value;
                    document.getElementById('etendueValue').textContent = parseFloat(e.target.value).toFixed(2);
                });
                
                // Button events
                document.getElementById('generateBtn').addEventListener('click', () => {
                    this.generateSeries();
                });
                
                document.getElementById('randomBtn').addEventListener('click', () => {
                    this.generateRandom();
                });
                
                document.getElementById('exampleBtn').addEventListener('click', () => {
                    this.loadExample();
                });
                
                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.reset();
                });
                
                // Export events
                document.getElementById('exportCSV').addEventListener('click', () => {
                    this.exportCSV();
                });
                
                document.getElementById('exportJSON').addEventListener('click', () => {
                    this.exportJSON();
                });
                
                document.getElementById('copyBtn').addEventListener('click', () => {
                    this.copyToClipboard();
                });
                
                document.getElementById('saveBtn').addEventListener('click', () => {
                    this.saveSeries();
                });
                
                // Modal events
                document.getElementById('closeModal').addEventListener('click', () => {
                    this.closeModal();
                });
                
                document.getElementById('copyModal').addEventListener('click', () => {
                    this.copyModalContent();
                });
            }
            
            updateSliders() {
                document.getElementById('effectifValue').textContent = 
                    `${document.getElementById('effectif').value} éléments`;
                document.getElementById('moyenneValue').textContent = 
                    parseFloat(document.getElementById('moyenne').value).toFixed(2);
                document.getElementById('medianeValue').textContent = 
                    parseFloat(document.getElementById('mediane').value).toFixed(2);
                document.getElementById('etendueValue').textContent = 
                    parseFloat(document.getElementById('etendue').value).toFixed(2);
            }
            
            generateSeries() {
                let n = parseInt(document.getElementById('effectif').value);
                let mean = parseFloat(document.getElementById('moyenne').value);
                let median = parseFloat(document.getElementById('mediane').value);
                let range = parseFloat(document.getElementById('etendue').value);
                
                // Validation
                if (isNaN(n) || n < 3) {
                    this.showError("L'effectif doit être un nombre ≥ 3");
                    return;
                }
                
                if (isNaN(mean) || isNaN(median) || isNaN(range) || range < 0) {
                    this.showError("Veuillez entrer des valeurs valides");
                    return;
                }
                
                // Generate base series
                let serie = [];
                let min = median - range / 2;
                let max = median + range / 2;
                
                for (let i = 0; i < n; i++) {
                    if (i < Math.floor(n / 2)) {
                        serie.push(min);
                    } else if (i === Math.floor(n / 2) && n % 2 !== 0) {
                        serie.push(median);
                    } else {
                        serie.push(max);
                    }
                }
                
                // Adjust to match mean
                let sum = serie.reduce((a, b) => a + b, 0);
                let diff = mean * n - sum;
                let increment = diff / n;
                serie = serie.map(x => x + increment);
                
                // Add some random variation for realism
                serie = serie.map(x => {
                    // Add small random variation (±5% of range)
                    let variation = (Math.random() - 0.5) * range * 0.05;
                    return x + variation;
                });
                
                this.serie = serie;
                this.updateDisplay();
            }
            
            generateRandom() {
                // Set random values
                document.getElementById('effectif').value = Math.floor(Math.random() * 18) + 3; // 3-20
                document.getElementById('moyenne').value = (Math.random() * 40 + 5).toFixed(1); // 5-45
                document.getElementById('mediane').value = (Math.random() * 40 + 5).toFixed(1); // 5-45
                document.getElementById('etendue').value = (Math.random() * 15 + 1).toFixed(1); // 1-16
                
                this.updateSliders();
                this.generateSeries();
            }
            
            loadExample() {
                // Set example values
                document.getElementById('effectif').value = 10;
                document.getElementById('moyenne').value = 15.5;
                document.getElementById('mediane').value = 16;
                document.getElementById('etendue').value = 8;
                
                this.updateSliders();
                this.generateSeries();
            }
            
            reset() {
                document.getElementById('effectif').value = 5;
                document.getElementById('moyenne').value = 10;
                document.getElementById('mediane').value = 10;
                document.getElementById('etendue').value = 4;
                
                this.updateSliders();
                this.generateSeries();
            }
            
            calculateStatistics() {
                if (this.serie.length === 0) return {};
                
                const sorted = [...this.serie].sort((a, b) => a - b);
                const n = this.serie.length;
                
                // Basic statistics
                const sum = this.serie.reduce((a, b) => a + b, 0);
                const mean = sum / n;
                const min = Math.min(...this.serie);
                const max = Math.max(...this.serie);
                const range = max - min;
                
                // Median
                let median;
                if (n % 2 === 0) {
                    median = (sorted[n/2 - 1] + sorted[n/2]) / 2;
                } else {
                    median = sorted[Math.floor(n/2)];
                }
                
                // Quartiles
                const q1 = this.calculatePercentile(sorted, 25);
                const q3 = this.calculatePercentile(sorted, 75);
                const iqr = q3 - q1;
                
                // Variance and standard deviation
                const variance = this.serie.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / n;
                const stdDev = Math.sqrt(variance);
                
                // Mode (simplified)
                const frequency = {};
                this.serie.forEach(val => {
                    const key = val.toFixed(2);
                    frequency[key] = (frequency[key] || 0) + 1;
                });
                const mode = Object.keys(frequency).reduce((a, b) => frequency[a] > frequency[b] ? a : b);
                
                // Sum of squares
                const sumSquares = this.serie.reduce((acc, val) => acc + Math.pow(val, 2), 0);
                
                return {
                    n,
                    sum: parseFloat(sum.toFixed(4)),
                    mean: parseFloat(mean.toFixed(4)),
                    median: parseFloat(median.toFixed(4)),
                    mode: parseFloat(mode),
                    min: parseFloat(min.toFixed(4)),
                    max: parseFloat(max.toFixed(4)),
                    range: parseFloat(range.toFixed(4)),
                    q1: parseFloat(q1.toFixed(4)),
                    q3: parseFloat(q3.toFixed(4)),
                    iqr: parseFloat(iqr.toFixed(4)),
                    variance: parseFloat(variance.toFixed(4)),
                    stdDev: parseFloat(stdDev.toFixed(4)),
                    sumSquares: parseFloat(sumSquares.toFixed(4))
                };
            }
            
            calculatePercentile(sorted, p) {
                const n = sorted.length;
                const pos = (n + 1) * p / 100;
                
                if (pos < 1) return sorted[0];
                if (pos >= n) return sorted[n - 1];
                
                const lower = sorted[Math.floor(pos) - 1];
                const upper = sorted[Math.floor(pos)];
                const fraction = pos - Math.floor(pos);
                
                return lower + fraction * (upper - lower);
            }
            
            updateDisplay() {
                const stats = this.calculateStatistics();
                this.updateStats(stats);
                this.updateTable();
                this.updateChart();
            }
            
            updateStats(stats) {
                const statsGrid = document.getElementById('statsGrid');
                
                const statItems = [
                    { label: 'Effectif', value: stats.n, icon: 'fas fa-hashtag' },
                    { label: 'Moyenne', value: stats.mean, icon: 'fas fa-calculator' },
                    { label: 'Médiane', value: stats.median, icon: 'fas fa-sort-amount-down' },
                    { label: 'Étendue', value: stats.range, icon: 'fas fa-ruler' },
                    { label: 'Minimum', value: stats.min, icon: 'fas fa-arrow-down' },
                    { label: 'Maximum', value: stats.max, icon: 'fas fa-arrow-up' },
                    { label: 'Écart-type', value: stats.stdDev, icon: 'fas fa-sigma' },
                    { label: 'Variance', value: stats.variance, icon: 'fas fa-square-root-alt' },
                    { label: 'Q1', value: stats.q1, icon: 'fas fa-chart-area' },
                    { label: 'Q3', value: stats.q3, icon: 'fas fa-chart-area' },
                    { label: 'Somme', value: stats.sum, icon: 'fas fa-plus-circle' },
                    { label: 'IQR', value: stats.iqr, icon: 'fas fa-chart-bar' }
                ];
                
                statsGrid.innerHTML = statItems.map(item => `
                    <div class="stat-card">
                        <i class="${item.icon}" style="font-size: 1.2rem; margin-bottom: 10px; opacity: 0.8;"></i>
                        <div class="stat-value">${typeof item.value === 'number' ? item.value.toFixed(2) : item.value}</div>
                        <div class="stat-label">${item.label}</div>
                    </div>
                `).join('');
            }
            
            updateTable() {
                const table = document.getElementById('seriesTable');
                const n = this.serie.length;
                
                // Create headers
                let html = '<tr>';
                for (let i = 0; i < Math.min(n, 10); i++) {
                    html += `<th>Valeur ${i + 1}</th>`;
                }
                html += '</tr>';
                
                // Create data row
                html += '<tr>';
                this.serie.slice(0, 10).forEach((value, index) => {
                    html += `<td class="data-cell">${value.toFixed(2)}</td>`;
                });
                
                // Fill remaining cells if less than 10
                for (let i = this.serie.length; i < 10; i++) {
                    html += '<td class="data-cell">-</td>';
                }
                html += '</tr>';
                
                // Create index row
                html += '<tr>';
                for (let i = 0; i < Math.min(n, 10); i++) {
                    html += `<td class="index-cell">Index ${i + 1}</td>`;
                }
                html += '</tr>';
                
                table.innerHTML = html;
            }
            
            updateChart() {
                const chart = document.getElementById('chart');
                const maxVal = Math.max(...this.serie);
                const minVal = Math.min(...this.serie);
                const range = maxVal - minVal;
                
                chart.innerHTML = this.serie.map((value, index) => {
                    const height = range > 0 ? ((value - minVal) / range * 100) : 50;
                    return `
                        <div class="bar" style="height: ${height}%" 
                             title="Valeur ${index + 1}: ${value.toFixed(2)}">
                            <span class="bar-value">${value.toFixed(1)}</span>
                        </div>
                    `;
                }).join('');
            }
            
            exportCSV() {
                if (this.serie.length === 0) return;
                
                let csv = 'Index,Valeur\n';
                this.serie.forEach((value, index) => {
                    csv += `${index + 1},${value.toFixed(4)}\n`;
                });
                
                this.showModal('Export CSV', csv, 'csv');
            }
            
            exportJSON() {
                if (this.serie.length === 0) return;
                
                const data = {
                    parameters: {
                        effectif: parseInt(document.getElementById('effectif').value),
                        moyenne: parseFloat(document.getElementById('moyenne').value),
                        mediane: parseFloat(document.getElementById('mediane').value),
                        etendue: parseFloat(document.getElementById('etendue').value)
                    },
                    serie: this.serie,
                    statistics: this.calculateStatistics(),
                    generatedAt: new Date().toISOString()
                };
                
                this.showModal('Export JSON', JSON.stringify(data, null, 2), 'json');
            }
            
            copyToClipboard() {
                if (this.serie.length === 0) return;
                
                const text = this.serie.map(v => v.toFixed(2)).join('\n');
                navigator.clipboard.writeText(text)
                    .then(() => {
                        this.showNotification('Données copiées dans le presse-papier !');
                    })
                    .catch(err => {
                        this.showError('Erreur lors de la copie : ' + err);
                    });
            }
            
            saveSeries() {
                if (this.serie.length === 0) return;
                
                const data = {
                    parameters: {
                        effectif: parseInt(document.getElementById('effectif').value),
                        moyenne: parseFloat(document.getElementById('moyenne').value),
                        mediane: parseFloat(document.getElementById('mediane').value),
                        etendue: parseFloat(document.getElementById('etendue').value)
                    },
                    serie: this.serie,
                    statistics: this.calculateStatistics()
                };
                
                localStorage.setItem('savedSeries', JSON.stringify(data));
                this.showNotification('Série sauvegardée localement !');
            }
            
            showModal(title, content, type = 'text') {
                const modal = document.getElementById('modal');
                const modalTitle = document.getElementById('modalTitle');
                const modalContent = document.getElementById('modalContent');
                
                modalTitle.textContent = title;
                modalContent.textContent = content;
                modalContent.className = type;
                
                modal.classList.add('active');
            }
            
            closeModal() {
                document.getElementById('modal').classList.remove('active');
            }
            
            copyModalContent() {
                const content = document.getElementById('modalContent').textContent;
                navigator.clipboard.writeText(content)
                    .then(() => {
                        this.showNotification('Contenu copié !');
                    });
            }
            
            showNotification(message) {
                // Create notification element
                const notification = document.createElement('div');
                notification.textContent = message;
                notification.style.cssText = `
                    position: fixed;
                    bottom: 20px;
                    right: 20px;
                    background: var(--primary);
                    color: white;
                    padding: 15px 25px;
                    border-radius: 10px;
                    box-shadow: var(--shadow-lg);
                    z-index: 1000;
                    animation: slideIn 0.3s ease;
                `;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.style.animation = 'slideOut 0.3s ease';
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            }
            
            showError(message) {
                const notification = document.createElement('div');
                notification.textContent = message;
                notification.style.cssText = `
                    position: fixed;
                    bottom: 20px;
                    right: 20px;
                    background: var(--danger);
                    color: white;
                    padding: 15px 25px;
                    border-radius: 10px;
                    box-shadow: var(--shadow-lg);
                    z-index: 1000;
                    animation: slideIn 0.3s ease;
                `;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.style.animation = 'slideOut 0.3s ease';
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Add CSS for animations
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideIn {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes slideOut {
                    from { transform: translateX(0); opacity: 1; }
                    to { transform: translateX(100%); opacity: 0; }
                }
                pre.csv { color: #10b981; }
                pre.json { color: #8b5cf6; }
            `;
            document.head.appendChild(style);
            
            const generator = new StatisticsGenerator();
            
            // Load saved series if exists
            const saved = localStorage.getItem('savedSeries');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    document.getElementById('effectif').value = data.parameters.effectif;
                    document.getElementById('moyenne').value = data.parameters.moyenne;
                    document.getElementById('mediane').value = data.parameters.mediane;
                    document.getElementById('etendue').value = data.parameters.etendue;
                    generator.updateSliders();
                    generator.serie = data.serie;
                    generator.updateDisplay();
                } catch (e) {
                    console.log('No valid saved data');
                }
            }
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'g') {
                    e.preventDefault();
                    generator.generateSeries();
                }
                if (e.ctrlKey && e.key === 'r') {
                    e.preventDefault();
                    generator.generateRandom();
                }
                if (e.key === 'Escape') {
                    generator.closeModal();
                }
            });
        });
    </script>
</body>
