<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1885ed">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">

    <title>Sign Up - Free HTML Page Template</title>
    <style>
    @import url("https://fonts.googleapis.com/css2?family=Quicksand:wght@300&display=swap");
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Quicksand", sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
      width: 100%;
      overflow: hidden;
    }
    .ring {
      position: relative;
      width: 450px;
      height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .ring i {
      position: absolute;
      inset: 0;
      border: 2px solid #fff;
      transition: 0.5s;
    }
    .ring i:nth-child(1) {
      border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
      animation: animate 6s linear infinite;
    }
    .ring i:nth-child(2) {
      border-radius: 41% 44% 56% 59%/38% 62% 63% 37%;
      animation: animate 4s linear infinite;
    }
    .ring i:nth-child(3) {
      border-radius: 41% 44% 56% 59%/38% 62% 63% 37%;
      animation: animate2 10s linear infinite;
    }
    .ring:hover i {
      border: 6px solid var(--clr);
      filter: drop-shadow(0 0 20px var(--clr));
    }
    @keyframes animate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes animate2 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .signup {
      position: absolute;
      width: 300px;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
    }
    .signup h2 {
      font-size: 2em;
      color: #fff;
    }
    .signup .inputBx {
      position: relative;
      width: 100%;
    }
    .signup .inputBx input {
      position: relative;
      width: 100%;
      padding: 12px 20px;
      background: transparent;
      border: 2px solid #fff;
      border-radius: 15px;
      font-size: 1.2em;
      color: #fff;
      box-shadow: none;
      outline: none;
    }
    .signup .inputBx input[type="submit"] {
      width: 100%;
      background: #0078ff;
      background: linear-gradient(45deg, #00ff0a, #00a2ff);
      border: none;
      cursor: pointer;
    }
    .signup .inputBx input::placeholder {
      color: rgba(255, 255, 255, 0.75);
    }
    .signup .links {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .signup .links a {
      color: #fff;
      text-decoration: none;
    }
    </style>
</head>

<body>
<!--ring div starts here-->
<div class="ring">
  <i style="--clr:#00ff0a;"></i>
  <i style="--clr:#ff0057;"></i>
  <i style="--clr:#00a2ff;"></i>
  <div class="signup">
    <h2>Sign Up</h2>
    <div class="inputBx">
      <input type="text" placeholder="Full Name">
    </div>
    <div class="inputBx">
      <input type="text" placeholder="Username">
    </div>
    <div class="inputBx">
      <input type="email" placeholder="Email">
    </div>
    <div class="inputBx">
      <input type="password" placeholder="Password">
    </div>
    <div class="inputBx">
      <input type="password" placeholder="Confirm Password">
    </div>
    <div class="inputBx">
      <input type="submit" value="Create Account">
    </div>
    <div class="links">
      <a href="Login-Math'Lab.html">Already have an account? Login</a>
    </div>
  </div>
</div>
<!--ring div ends here-->

<!-- Script pour redirection -->
<script>
  const signupButton = document.querySelector('.signup .inputBx input[type="submit"]');
  signupButton.addEventListener('click', function() {
    window.location.href = 'MathLab.html'; // Redirige vers MathLab.html après inscription
  });
</script>
</body>
</html>
